name: hatto_store
description: >-
  Side SQLite and the single write wrapper beside the resident rslib collection.
  v0 stores Hatto metadata here, not inside the collection.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  path: ^1.9.1
  # Own SQLite via native-asset hooks. Do not point this at rusqlite or at
  # the process symbol table: rslib already bundles a second SQLite.
  sqlite3: ^3.8.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.0
