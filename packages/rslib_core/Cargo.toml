[package]
name = "rslib_core"
description = "Anki rslib protobuf channel and call policy. Linked once per process."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
hatto_card_contract = { path = "../hatto_card_contract" }
# Unmodified Anki 26.09.3 (gitlink). This is the only crate that links rslib.
anki = { path = "../../third_party/anki/rslib", features = ["rustls"] }
anki_proto = { path = "../../third_party/anki/rslib/proto" }
prost = "0.13"
# rslib calls tokio::io::{AsyncReadExt, AsyncWriteExt}. Anki's workspace
# tokio features omit `io-util`. Enabling it here unifies the feature for this
# build without editing rslib.
tokio = { version = "1.45", features = ["io-util"] }
serde = "1"
serde_json = "1"

[build-dependencies]
anyhow = "1"
anki_proto_gen = { path = "../../third_party/anki/rslib/proto_gen" }
prost-build = "0.13"
prost-reflect = "0.14.7"

[dev-dependencies]
tempfile = "3"
