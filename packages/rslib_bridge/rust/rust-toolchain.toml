[toolchain]
# Keep in lockstep with the workspace root toolchain file.
channel = "1.97.1"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  # native_toolchain_rust refuses a macOS build unless the requested triple
  # is listed. The release app is arm64 only.
  "aarch64-apple-darwin",
]
