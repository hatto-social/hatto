[package]
name = "hatto_card_contract"
description = "Pure note-guid derivation, import classification, and guid format checks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
regex = "=1.13.1"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
uuid = { version = "1.11", default-features = false, features = ["std", "v5"] }

[dev-dependencies]
proptest = "1.6"
serde_json = "1"
