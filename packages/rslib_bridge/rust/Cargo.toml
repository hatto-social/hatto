[package]
name = "rslib_bridge"
description = "flutter_rust_bridge entry to Anki rslib, protobuf backend channel only"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# Name is required. flutter_rust_bridge's cargokit build names the cdylib
# `libUNKNOWN.so` when this is omitted, and Android then fails to dlopen the
# library the Dart loader asks for (`librslib_bridge.so`).
name = "rslib_bridge"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
hatto_card_contract = { path = "../../hatto_card_contract" }
# Import pipeline, linked into this cdylib. It depends on rslib_core, not on
# this crate, so the graph has no cycle and one rslib.
hatto_import = { path = "../../hatto_import" }
rslib_core = { path = "../../rslib_core" }
anki_proto = { path = "../../../third_party/anki/rslib/proto" }
flutter_rust_bridge = "=2.13.0"
prost = "0.13"
# Same versions as Anki 26.09.3 so the graph unifies. Used only to read an
# exported package, not to call into rslib.
rusqlite = "0.36.0"
serde_json = "1"
zip = { version = "4.1.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"

# Host generator for the arm64-smoke colpkg fixtures. Not linked into the app.
[[bin]]
name = "make_synthetic_decks"
path = "../../../tools/arm64-smoke/synthetic/src/main.rs"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
