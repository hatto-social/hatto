[package]
name = "hatto_import"
description = "E pipeline for a desktop .apkg import. Does not take a resident collection."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anki_proto = { path = "../../third_party/anki/rslib/proto" }
hatto_card_contract = { path = "../hatto_card_contract" }
prost = "0.13"
# Protobuf channel only: unrestricted open_backend and command. The desktop
# allowlist is not used. rslib itself is the anki crate behind that channel.
rslib_bridge = { path = "../rslib_bridge/rust" }
rusqlite = { version = "0.36.0", features = ["bundled"] }
serde_json = "1"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
uuid = { version = "1.11", default-features = false, features = ["std", "v4"] }
zip = { version = "4.1.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3"
