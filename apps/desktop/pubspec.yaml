name: hatto_desktop
description: >-
  Hatto desktop app for macOS and Linux. Opens a collection through the
  desktop bridge profile and shows the study flow.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  hatto_legal: any
  hatto_store: any
  path: ^1.9.1
  path_provider: ^2.1.5
  rslib_bridge: any
  fixnum: ^1.1.1
  protobuf: ^6.0.0
  html: ^0.15.6
  path_drawing: ^1.0.1
  flutter_widget_from_html_core: ^0.17.0
  audioplayers: ^6.4.0
  flutter_math_fork: 0.7.4
  # desktop_drop 0.9.2 needs cross_file 0.4. file_selector 1.1.0 still
  # publishes against cross_file 0.3, so the file_selector packages under
  # third_party/ are the upstream BSD-3-Clause sources with XFile(path)
  # updated to XFile.fileSystem(path:). Every implementation is vendored
  # because `flutter build` compiles them all into the kernel snapshot.
  cross_file: ^0.4.0
  desktop_drop: ^0.9.2
  file_selector: 1.1.0

dependency_overrides:
  cross_file: ^0.4.0
  file_selector_platform_interface:
    path: third_party/file_selector_platform_interface
  file_selector_linux:
    path: third_party/file_selector_linux
  file_selector_macos:
    path: third_party/file_selector_macos
  file_selector_ios:
    path: third_party/file_selector_ios
  file_selector_android:
    path: third_party/file_selector_android
  file_selector_windows:
    path: third_party/file_selector_windows
  file_selector_web:
    path: third_party/file_selector_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^3.8.0
  cross_file_io: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/rust-crates.json
    - assets/licenses/material-icons.json
    - assets/licenses/flutter-sdk.json
