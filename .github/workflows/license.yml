name: license

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install REUSE
        # reuse 6.3.0 raises NoEncodingModuleError unless charset-normalizer
        # is installed beside it.
        run: python -m pip install "reuse==6.3.0" charset-normalizer

      - name: Check licenses
        run: tools/license/check.sh

  # cargo-deny and notice regeneration are slow (Anki submodule, Flutter SDK,
  # Android resolve). Run them only when the inputs of those notices change.
  notices-filter:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Detect notice inputs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys

          base = os.environ.get("BASE_SHA") or ""
          run = True
          if base and set(base) != {"0"}:
              diff = subprocess.run(
                  ["git", "diff", "--name-only", base, "HEAD"],
                  check=False,
                  text=True,
                  capture_output=True,
              )
              if diff.returncode == 0:
                  prefixes = (
                      "packages/rslib_bridge/rust/",
                      "tools/license/",
                      "apps/mobile/assets/licenses/",
                      "apps/desktop/",
                  )
                  exact = {
                      "Cargo.lock",
                      "Cargo.toml",
                      "pubspec.lock",
                      "pubspec.yaml",
                      "THIRD_PARTY_NOTICES.md",
                      ".github/workflows/license.yml",
                  }
                  run = False
                  for path in diff.stdout.splitlines():
                      gradle = path.startswith("apps/mobile/android/") and (
                          path.endswith((".gradle", ".kts", ".properties"))
                          or "/gradle/" in path
                      )
                      if path in exact or path.startswith(prefixes) or gradle:
                          run = True
                          break
                      if path.endswith("pubspec.yaml") or path.endswith("pubspec.lock"):
                          run = True
                          break
          value = "true" if run else "false"
          print(f"notice check: {value}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={value}\n")
          PY

  notices:
    needs: notices-filter
    if: needs.notices-filter.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-about and cargo-deny
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/cargo-about.tgz \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/cargo-about-0.9.3-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o /tmp/cargo-deny.tgz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.21.0/cargo-deny-0.21.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/cargo-about.tgz -C /tmp
          tar -xzf /tmp/cargo-deny.tgz -C /tmp
          install -m 755 /tmp/cargo-about-0.9.3-x86_64-unknown-linux-musl/cargo-about "$HOME/.local/bin/cargo-about"
          install -m 755 /tmp/cargo-deny-0.21.0-x86_64-unknown-linux-musl/cargo-deny "$HOME/.local/bin/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Flutter 3.47.9
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/flutter.tar.xz \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  /tmp/flutter.tar.xz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xf /tmp/flutter.tar.xz
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --android

      - name: Install Gradle 9.3.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d /usr/local/lib/android/sdk ]; then
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
              ANDROID_HOME=/usr/local/lib/android/sdk
            else
              echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
              ANDROID_HOME="$RUNNER_TEMP/android-sdk"
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              curl -fL --retry 3 -o /tmp/cmdtools.zip \
                https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
              unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            fi
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Regenerate notices and fail on drift
        run: |
          tools/license/gen-notices.sh
          git diff --exit-code -- \
            THIRD_PARTY_NOTICES.md \
            apps/mobile/assets/licenses \
            apps/desktop/assets/licenses
