name: hatto_desktop
description: >-
  Hatto desktop app for macOS and Linux. Opens a collection through the
  desktop bridge profile and shows the study flow and note editor.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  hatto_legal: any
  path: ^1.9.1
  path_provider: ^2.1.5
  rslib_bridge: any
  fixnum: ^1.1.1
  protobuf: ^6.0.0
  html: ^0.15.6
  path_drawing: ^1.0.1
  flutter_widget_from_html_core: ^0.17.0
  audioplayers: ^6.4.0
  flutter_math_fork: 0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/rust-crates.json
    - assets/licenses/material-icons.json
    - assets/licenses/flutter-sdk.json
