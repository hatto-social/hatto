name: license

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install REUSE
        # reuse 6.3.0 raises NoEncodingModuleError unless charset-normalizer
        # is installed beside it.
        run: python -m pip install "reuse==6.3.0" charset-normalizer

      - name: Check licenses
        run: tools/license/check.sh
