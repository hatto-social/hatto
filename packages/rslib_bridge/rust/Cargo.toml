[package]
name = "rslib_bridge"
description = "flutter_rust_bridge entry to Anki rslib, protobuf backend channel only"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Unmodified Anki 26.09.3 (gitlink). Path deps stay inside that checkout; we do not patch it.
anki = { path = "../../../third_party/anki/rslib", features = ["rustls"] }
anki_proto = { path = "../../../third_party/anki/rslib/proto" }
flutter_rust_bridge = "=2.13.0"
prost = "0.13"

[build-dependencies]
anyhow = "1"
anki_proto_gen = { path = "../../../third_party/anki/rslib/proto_gen" }
prost-build = "0.13"
prost-reflect = "0.14.7"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
