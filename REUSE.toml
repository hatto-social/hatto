version = 1
SPDX-PackageName = "hatto"
SPDX-PackageDownloadLocation = "https://github.com/hatto-social/hatto"

# Product sources carry the same grant in SPDX headers. This annotation covers
# everything else (generated code, spikes, demo-app, config, docs, fixtures we
# wrote). Later annotations override it for files that are not ours alone.
[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Hatto Social contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Dart generated from Anki .proto, and the service index extracted from that
# tree. Anki's copyright stays on the derivative.
[[annotations]]
path = [
  "spikes/rslib-26.09.3/mobile/lib/gen_proto/**",
  "spikes/rslib-26.09.3/mobile/assets/service-ids.json",
  "spikes/rslib-26.09.3/napi/service-ids.json",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "Ankitects Pty Ltd and contributors",
  "2026 Hatto Social contributors",
]
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated notices quote third-party copyright lines and license texts.
# `closest` would treat those quotations as the copyright of the file.
[[annotations]]
path = [
  "THIRD_PARTY_NOTICES.md",
  "apps/mobile/assets/licenses/rust-crates.json",
  "apps/mobile/assets/licenses/android-deps.json",
  "apps/mobile/assets/licenses/material-icons.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Hatto Social contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# These files quote other people's copyright lines (the DCO, the Anki port
# header). `closest` would treat the quotations as the copyright of the file.
# The files themselves are ours.
[[annotations]]
path = [
  "NOTICE.md",
  "CONTRIBUTING.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Hatto Social contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
