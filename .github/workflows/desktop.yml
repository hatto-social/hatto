name: desktop

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Linux runs the full desktop check on every pull request and on main.
# macOS is arm64 build plus smoke. Golden images are Linux-only, so the
# macOS test excludes the golden tag. macOS runs when desktop or bridge
# paths change, and on every push to main. There is no signing or notarization.

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux desktop packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-14-dev

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install protoc 31.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc"
          unzip -q -o /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.local/protoc/bin/protoc" --version

      - name: Install Flutter 3.47.9
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/flutter.tar.xz \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  /tmp/flutter.tar.xz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xf /tmp/flutter.tar.xz
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze apps/desktop
          flutter analyze packages/rslib_bridge
          flutter analyze apps/mobile
          flutter analyze packages/hatto_store
          flutter analyze packages/hatto_legal

      - name: Test desktop, bridge, mobile, and the side database
        run: |
          # Each package looks up native assets relative to its own directory.
          (cd apps/desktop && flutter test)
          (cd packages/rslib_bridge && flutter test)
          (cd apps/mobile && flutter test)
          (cd packages/hatto_store && flutter test)
          (cd packages/hatto_legal && flutter test)

      - name: Build the Linux app
        working-directory: apps/desktop
        run: flutter build linux --release

      - name: Test the bridge
        run: cargo test -p rslib_bridge -- --test-threads=1

  macos:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect macOS inputs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REF_NAME: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, subprocess

          event = os.environ.get("EVENT_NAME") or ""
          ref = os.environ.get("REF_NAME") or ""
          run = event == "push" and ref == "refs/heads/main"
          if not run:
              base = os.environ.get("BASE_SHA") or ""
              diff = subprocess.run(
                  ["git", "diff", "--name-only", base, "HEAD"],
                  check=False,
                  text=True,
                  capture_output=True,
              )
              prefixes = (
                  "apps/desktop/",
                  "packages/rslib_bridge/",
                  ".github/workflows/desktop.yml",
              )
              if diff.returncode == 0:
                  for path in diff.stdout.splitlines():
                      if path.startswith(prefixes) or path == ".github/workflows/desktop.yml":
                          run = True
                          break
              else:
                  run = True
          value = "true" if run else "false"
          print(f"macos job: {value}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={value}\n")
          PY

      - name: Set up Rust 1.97.1
        if: steps.filter.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install protoc 31.1
        if: steps.filter.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-osx-aarch_64.zip
          echo "4aeea0a34b0992847b03a8489a8dbedf3746de01109b74cc2ce9b6888a901ed9  /tmp/protoc.zip" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/protoc"
          unzip -q -o /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.local/protoc/bin/protoc" --version

      - name: Install Flutter 3.47.9
        if: steps.filter.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/flutter.zip \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.47.9-stable.zip
          echo "6545b85938745dc5070e9faf2adf70233c1811009d87fe6d27bfcda5a04b7698  /tmp/flutter.zip" | shasum -a 256 -c -
          unzip -q /tmp/flutter.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics

      - name: Resolve Dart packages
        if: steps.filter.outputs.run == 'true'
        run: flutter pub get

      - name: Analyze the desktop app
        if: steps.filter.outputs.run == 'true'
        run: flutter analyze apps/desktop

      - name: Smoke tests, excluding Linux goldens
        if: steps.filter.outputs.run == 'true'
        working-directory: apps/desktop
        run: flutter test --exclude-tags golden

      - name: Build the macOS app without signing
        if: steps.filter.outputs.run == 'true'
        working-directory: apps/desktop
        run: flutter build macos --release
