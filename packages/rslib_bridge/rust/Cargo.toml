[package]
name = "rslib_bridge"
description = "flutter_rust_bridge entry to Anki rslib, protobuf backend channel only"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# Name is required. flutter_rust_bridge's cargokit build names the cdylib
# `libUNKNOWN.so` when this is omitted, and Android then fails to dlopen the
# library the Dart loader asks for (`librslib_bridge.so`).
name = "rslib_bridge"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Unmodified Anki 26.09.3 (gitlink). Path deps stay inside that checkout; we do not patch it.
anki = { path = "../../../third_party/anki/rslib", features = ["rustls"] }
anki_proto = { path = "../../../third_party/anki/rslib/proto" }
flutter_rust_bridge = "=2.13.0"
prost = "0.13"
# rslib calls tokio::io::{AsyncReadExt, AsyncWriteExt}. Anki's workspace
# tokio features omit `io-util`. Enabling it here unifies the feature for this
# build without editing rslib.
tokio = { version = "1.45", features = ["io-util"] }
# Same versions as Anki 26.09.3 so the graph unifies. Used only to read an
# exported package, not to call into rslib.
rusqlite = "0.36.0"
zip = { version = "4.1.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"

[build-dependencies]
anyhow = "1"
anki_proto_gen = { path = "../../../third_party/anki/rslib/proto_gen" }
prost-build = "0.13"
prost-reflect = "0.14.7"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
